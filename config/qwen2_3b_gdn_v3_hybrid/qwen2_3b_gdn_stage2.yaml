data:
  # name: "robbiegwaldd/dclm-10B"
  # path: "robbiegwaldd/dclm-10B"
  # cache_dir: '/workspace/checkpoints/data_cache/chunked_context4096'
  cache_dir: '/workspace/checkpoints/data_cache/llama/chunked_context512'

teacher_model:
  # name: 'fla-hub/Qwen2.5-3B-Instruct'
  name: 'meta-llama/Llama-3.2-3B-Instruct'

student_model:
  name: 'gdn_v3'
  #keep_full_attention_layers: [5, 17, 19, 20, 25, 31, 32, 33, 27]
  # keep_full_attention_layers: [33, 32, 20, 25, 27, 21, 5, 17, 4]
  # keep_full_attention_layers: [33, 25, 20, 17, 10, 13, 32, 21, 27]
  # keep_full_attention_layers: [33, 32, 25, 5, 20] # , 21, 31, 17, 19]
  
  # [33,32,5,20,17,25,4,19,10]
  # keep_full_attention_layers: [20, 32, 33, 21, 22]
  # keep_full_attention_layers: [27, 21, 13, 32, 22, 17, 33, 5, 20]
  keep_full_attention_layers: [14, 8, 5, 12, 15, 13, 2]

train:
  target_tokens: 600_000_000
  batch_size: 32
  micro_batch_size: 2
  train_seq_len: 4096
  lr_scheduler_type: constant
  lr: 0.000007 # all but attention layers
  lr_attn: 0.0001 # attention layers

  max_grad_norm: 1.0
  # output_dir: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_25/stage2'
  # output_dir: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_12/stage2'
  # output_dir: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_rwkv_fixed_25/stage2'
  # output_dir: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_rwkv_12_ori/stage2'
  # output_dir: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_fixed_25/stage2'
  # output_dir: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_ruler_25/stage2'
  output_dir: '/workspace/checkpoints/outputs/llama_3b_instruct_gdn3_hybrid_25/stage2'
  # student_init_ckpt: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_25/stage1/converted-hf'
  # student_init_ckpt: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_12/stage1/converted-hf'
  # student_init_ckpt: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_rwkv_fixed_25/stage1/converted-hf'
  # student_init_ckpt: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_fixed_25/stage1/converted-hf'
  # student_init_ckpt: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_rwkv_12_ori/stage1/converted-hf'
  # student_init_ckpt: '/workspace/checkpoints/outputs/qwen_3b_instruct_gdn3_hybrid_ruler_25/stage1/converted-hf'
  student_init_ckpt: '/workspace/checkpoints/outputs/llama_3b_instruct_gdn3_hybrid_25/stage1/converted-hf'
  max_length: 4096
  # tokenizer
  add_eos_token: False
  resume_from_checkpoint: None

stage: 2
